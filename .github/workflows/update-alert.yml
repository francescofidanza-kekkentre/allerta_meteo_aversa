name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scansione OpenData DPC e Campania
        run: |
          python3 -c "
          import urllib.request, json, datetime, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          status = 'VERDE'
          msg = 'Nessuna allerta critica per Aversa (Zona 2)'
          found = False

          # 1. Scansione OpenData Protezione Civile Nazionale
          dpc_url = 'https://raw.githubusercontent.com/pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica/master/latest/today_today.json'
          try:
              req = urllib.request.Request(dpc_url, headers=headers)
              with urllib.request.urlopen(req, timeout=12, context=ctx) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  print('>>> Connessione OpenData DPC riuscita.')
                  
                  crit_list = []
                  for feature in data.get('features', []):
                      props = feature.get('properties', {})
                      info_str = str(props).lower()
                      
                      # Verifica se la feature riguarda la Campania / Zona 2
                      if 'cam' in info_str or 'campania' in info_str:
                          if any(k in info_str for k in ['elevata', 'rossa', '3']):
                              crit_list.append('ROSSA')
                          elif any(k in info_str for k in ['moderata', 'arancione', '2']):
                              crit_list.append('ARANCIONE')
                          elif any(k in info_str for k in ['ordinaria', 'gialla', '1']):
                              crit_list.append('GIALLA')

                  if 'ROSSA' in crit_list:
                      status, msg, found = 'ROSSA', '🔴 ALLERTA ROSSA per Aversa (Zona 2)', True
                  elif 'ARANCIONE' in crit_list:
                      status, msg, found = 'ARANCIONE', '🚨 ALLERTA ARANCIONE per Aversa (Zona 2)', True
                  elif 'GIALLA' in crit_list:
                      status, msg, found = 'GIALLA', '⚠️ ALLERTA GIALLA per Aversa (Zona 2)', True
                  
                  print(f'>>> Criticità rilevate da DPC: {crit_list}')
          except Exception as e:
              print(f'>>> Errore OpenData DPC: {e}')

          # 2. Scansione di riserva su RSS / Portale Campania
          if not found:
              print('>>> Avvio scansione di riserva su portale regionale...')
              urls = [
                  'https://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo',
                  'https://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo'
              ]
              raw_text = ''
              for u in urls:
                  try:
                      req = urllib.request.Request(u, headers=headers)
                      with urllib.request.urlopen(req, timeout=10, context=ctx) as r:
                          raw_text += ' ' + r.read().decode('utf-8', errors='ignore')
                  except Exception as e:
                      print(f'Errore {u}: {e}')

              text_lower = raw_text.lower()
              if 'arancion' in text_lower or 'moderata critic' in text_lower or 'preallarme' in text_lower:
                  status = 'ARANCIONE'
                  msg = '🚨 ALLERTA ARANCIONE per Aversa (Zona 2)'
              elif 'giall' in text_lower or 'ordinaria critic' in text_lower or 'attenzione' in text_lower:
                  status = 'GIALLA'
                  msg = '⚠️ ALLERTA GIALLA per Aversa (Zona 2)'
              elif 'ross' in text_lower or 'elevata critic' in text_lower or 'allarme' in text_lower:
                  status = 'ROSSA'
                  msg = '🔴 ALLERTA ROSSA per Aversa (Zona 2)'

          print(f'>>> RISULTATO FINALE SALVATO: {status} - {msg}')

          out = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
