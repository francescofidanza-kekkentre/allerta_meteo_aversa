name: Update Weather Alerts

on:
  schedule:
    # Esegue lo script ogni 30 minuti
    - cron: '*/30 * * * *'
  # Avvio manuale dalla scheda Actions e dal Worker Cloudflare "allerta-meteo-cron"
  # (worker/), che lo chiama ogni 30 minuti: il cron di GitHub viene spesso
  # ritardato di ore e qui resta solo come riserva.
  workflow_dispatch:

# Una sola esecuzione alla volta: Worker e cron di GitHub possono coincidere.
concurrency:
  group: update-alert
  cancel-in-progress: false

jobs:
  update-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Esegui lo script Python
        env:
          # Per le chiamate all'API GitHub (bollettino nazionale DPC) senza il limite di 60/ora
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python fetch_alerts.py

      - name: Salva e fai il commit di alert.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert.json
          git commit -m "Automated update of alert.json" || exit 0
          git pull --rebase
          git push
