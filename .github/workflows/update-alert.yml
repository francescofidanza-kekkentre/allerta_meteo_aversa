name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *' # Si esegue automaticamente ogni ora
  workflow_dispatch: # Ti permette di avviarlo manualmente con un click da GitHub

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Controllo Bollettino Campania
        run: |
          python3 -c "
          import urllib.request, json, datetime, re

          url = 'http://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo'
          status = 'VERDE'
          msg = 'Nessuna allerta critica per la Zona 2 (Agro Aversano)'

          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8').lower()
              
              if 'arancione' in html:
                  status = 'ARANCIONE'
                  msg = '🚨 Allerta Arancione per la Zona 2 (Agro Aversano)'
              elif 'gialla' in html or 'attenzione' in html:
                  status = 'GIALLA'
                  msg = '⚠️ Allerta Gialla per la Zona 2 (Agro Aversano)'
              elif 'rossa' in html:
                  status = 'ROSSA'
                  msg = '🔴 ALLERTA ROSSA per la Zona 2 (Agro Aversano)'
          except Exception as e:
              print('Errore durante lo scraping:', e)

          data = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio file alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
