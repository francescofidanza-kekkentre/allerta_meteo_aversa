name: Scraping Meteo & Allerte Aversa

on:
  schedule:
    # Esegue lo script ogni ora (al minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Permette di avviare lo script anche manualmente con un click

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa Playwright e dipendenze
        run: |
          npm init -y
          npm install playwright axios xml2js
          npx playwright install --with-deps chromium

      - name: Esegui lo script scrape.js
        run: node scrape.js

      - name: Commit e Push del file alert.json aggiornato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update alert.json [skip ci]" && git push)
