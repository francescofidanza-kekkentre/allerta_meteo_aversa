name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scansione Testo Grezzo Portale Campania
        run: |
          python3 -c "
          import urllib.request, json, datetime, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          status = 'VERDE'
          msg = 'Nessuna allerta critica per Aversa (Zona 2)'

          # URL diretti del Centro Funzionale Campania
          urls = [
              'http://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo',
              'http://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo',
              'http://centrofunzionale.regione.campania.it/it/avvisi/avvisi-di-allerta-meteo'
          ]

          raw_text = ''
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=12, context=ctx) as resp:
                      content = resp.read().decode('utf-8', errors='ignore')
                      raw_text += ' ' + content
                      print(f'>>> Caricato: {url} ({len(content)} caratteri)')
              except Exception as e:
                  print(f'>>> Errore caricamento {url}: {e}')

          text_lower = raw_text.lower()

          # Ricerca parole chiave nel testo (senza parsing XML)
          if 'arancion' in text_lower or 'preallarme' in text_lower or 'moderata critic' in text_lower:
              status = 'ARANCIONE'
              msg = '🚨 ALLERTA ARANCIONE per Aversa (Zona 2)'
          elif 'giall' in text_lower or 'attenzione' in text_lower or 'ordinaria critic' in text_lower:
              status = 'GIALLA'
              msg = '⚠️ ALLERTA GIALLA per Aversa (Zona 2)'
          elif 'ross' in text_lower or 'allarme' in text_lower or 'elevata critic' in text_lower:
              status = 'ROSSA'
              msg = '🔴 ALLERTA ROSSA per Aversa (Zona 2)'

          print(f'>>> ESITO FINALE RILEVATO: {status} - {msg}')

          out = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
