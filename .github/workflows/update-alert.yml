name: Update Weather Alerts

on:
  schedule:
    # Esegue lo script ogni 30 minuti
    - cron: '*/30 * * * *'
  # Permette di avviare l'azione manualmente dalla scheda Actions di GitHub
  workflow_dispatch:

jobs:
  update-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Esegui lo script Python
        run: |
          python fetch_alerts.py

      - name: Salva e fai il commit di alert.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alert.json
          git commit -m "Automated update of alert.json" || exit 0
          git push
