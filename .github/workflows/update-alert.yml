name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *' # Esecuzione automatica ogni ora
  workflow_dispatch: # Avvio manuale

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Librerie (Requests, BeautifulSoup, Feedparser)
        run: pip install requests beautifulsoup4 feedparser

      - name: Scansione Avanzata RSS e Bollettini
        run: |
          python3 -c "
          import requests, json, datetime, feedparser, urllib3
          from bs4 import BeautifulSoup

          # Disabilita warning SSL
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}
          status = 'VERDE'
          msg = 'Nessuna allerta critica per Aversa (Zona 2)'
          corpus = []

          # 1. Lettura Feed RSS ufficiale con Feedparser
          rss_urls = [
              'http://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo',
              'https://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo'
          ]

          for url in rss_urls:
              try:
                  feed = feedparser.parse(url)
                  print(f'>>> RSS {url}: trovati {len(feed.entries)} avvisi.')
                  for entry in feed.entries:
                      title = entry.get('title', '')
                      summary = entry.get('summary', '')
                      print(f'    [AVVISO RSS] {title}')
                      corpus.append(f'{title} {summary}')
              except Exception as e:
                  print(f'>>> Errore RSS {url}: {e}')

          # 2. Scansione pagine web ufficiali
          web_urls = [
              'https://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo',
              'https://www.regione.campania.it/regione/it/news/protezione-civile-1'
          ]

          for url in web_urls:
              try:
                  res = requests.get(url, headers=headers, timeout=12, verify=False)
                  if res.status_code == 200:
                      soup = BeautifulSoup(res.text, 'html.parser')
                      for s in soup(['script', 'style']):
                          s.decompose()
                      t = soup.get_text(separator=' ')
                      print(f'>>> HTML {url}: estratti {len(t)} caratteri di testo.')
                      corpus.append(t)
              except Exception as e:
                  print(f'>>> Errore HTML {url}: {e}')

          full_text = ' '.join(corpus).lower()

          # Valutazione della criticità
          if any(k in full_text for k in ['arancion', 'preallarme', 'moderata critic']):
              status = 'ARANCIONE'
              msg = '🚨 ALLERTA ARANCIONE per Aversa (Zona 2)'
          elif any(k in full_text for k in ['giall', 'ordinaria critic', 'attenzione']):
              status = 'GIALLA'
              msg = '⚠️ ALLERTA GIALLA per Aversa (Zona 2)'
          elif any(k in full_text for k in ['ross', 'elevata critic', 'fase di allarme']):
              status = 'ROSSA'
              msg = '🔴 ALLERTA ROSSA per Aversa (Zona 2)'

          print(f'>>> ESITO FINALE RILEVATO: {status} - {msg}')

          out = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
