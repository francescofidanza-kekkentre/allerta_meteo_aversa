name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *' # Si esegue automaticamente ogni ora
  workflow_dispatch: # Permette l'avvio manuale

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Controllo Bollettino e Feed Campania
        run: |
          python3 -c "
          import urllib.request, json, datetime, re, xml.etree.ElementTree as ET

          status = 'VERDE'
          msg = 'Nessuna allerta critica per la Zona 2 (Agro Aversano)'
          headers = {'User-Agent': 'Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)'}

          sources = [
              'http://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo',
              'http://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo'
          ]

          combined_text = ''
          for url in sources:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      content = resp.read().decode('utf-8', errors='ignore')
                      combined_text += ' ' + content.lower()
              except Exception as e:
                  print(f'Errore lettura {url}: {e}')

          # Analisi livello di allerta con priorità
          if 'arancione' in combined_text or 'fase di allarme' in combined_text:
              status = 'ARANCIONE'
              msg = '🚨 Allerta Arancione per la Zona 2 (Agro Aversano)'
          elif 'gialla' in combined_text or 'fase di attenzione' in combined_text:
              status = 'GIALLA'
              msg = '⚠️ Allerta Gialla per la Zona 2 (Agro Aversano)'
          elif 'rossa' in combined_text:
              status = 'ROSSA'
              msg = '🔴 ALLERTA ROSSA per la Zona 2 (Agro Aversano)'

          data = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio file alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
