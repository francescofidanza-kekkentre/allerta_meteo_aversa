name: Aggiorna Allerta Meteo Aversa

on:
  schedule:
    - cron: '0 * * * *' # Esecuzione ogni ora
  workflow_dispatch: # Avvio manuale

permissions:
  contents: write

jobs:
  check-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scansione Bollettini e Termini Tecnici Protezione Civile
        run: |
          python3 -c "
          import urllib.request, json, datetime, ssl

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          status = 'VERDE'
          msg = 'Nessuna allerta critica per Aversa / Zona 2'

          # Fonti: Open Data DPC Nazionale + Portale Campania + Feed RSS
          urls = [
              'https://raw.githubusercontent.com/pcm-dpc/DPC-Bollettini-Criticita-Idrogeologica-Idraulica/master/latest/bollettino.json',
              'https://centrofunzionale.regione.campania.it/it/rss/avvisi-di-allerta-meteo',
              'https://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo'
          ]

          fetched = []
          for url in urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15, context=ctx) as resp:
                      fetched.append(resp.read().decode('utf-8', errors='ignore'))
              except Exception as e:
                  print(f'Errore {url}: {e}')

          text = ' '.join(fetched).lower()

          # Valutazione con termini tecnici e colori ufficiali
          if any(k in text for k in ['rossa', 'elevata criticita', 'elevata criticità', 'fase di allarme']):
              status = 'ROSSA'
              msg = '🔴 ALLERTA ROSSA per Aversa (Zona 2)'
          elif any(k in text for k in ['arancione', 'moderata criticita', 'moderata criticità', 'preallarme']):
              status = 'ARANCIONE'
              msg = '🚨 ALLERTA ARANCIONE per Aversa (Zona 2)'
          elif any(k in text for k in ['gialla', 'ordinaria criticita', 'ordinaria criticità', 'fase di attenzione']):
              status = 'GIALLA'
              msg = '⚠️ ALLERTA GIALLA per Aversa (Zona 2)'

          out = {
              'status': status,
              'message': msg,
              'updated_at': datetime.datetime.now().strftime('%d/%m/%Y %H:%M')
          }

          with open('alert.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          "

      - name: Salvataggio alert.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add alert.json
          git commit -m "Aggiornamento automatico allerta Aversa" || exit 0
          git push
