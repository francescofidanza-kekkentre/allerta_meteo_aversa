<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona originale Aversa Meteo & Allerte. Sfondo a tutto campo (variante "any" con angoli arrotondati):
       il contenuto resta nel cerchio sicuro centrale (raggio ~205px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Nuvola -->
  <g fill="#ffffff">
    <circle cx="200" cy="250" r="62"/>
    <circle cx="275" cy="215" r="80"/>
    <circle cx="340" cy="262" r="52"/>
    <rect x="140" y="250" width="252" height="64" rx="32"/>
  </g>
  <!-- Pioggia -->
  <g stroke="#bae6fd" stroke-width="14" stroke-linecap="round">
    <line x1="190" y1="342" x2="178" y2="372"/>
    <line x1="245" y1="342" x2="233" y2="372"/>
  </g>
  <!-- Triangolo di allerta -->
  <g transform="translate(318 318)">
    <path d="M0 -62 L58 40 H-58 Z" fill="#facc15" stroke="#facc15" stroke-width="18" stroke-linejoin="round"/>
    <rect x="-7" y="-26" width="14" height="40" rx="7" fill="#0c4a6e"/>
    <circle cx="0" cy="28" r="8.5" fill="#0c4a6e"/>
  </g>
</svg>
