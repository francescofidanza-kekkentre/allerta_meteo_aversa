<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meteo & Allerte Aversa - macOS Widget</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
      --glass-bg: rgba(30, 41, 59, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      overflow-x: hidden;
    }

    /* Widget Glassmorphism macOS */
    .widget-container {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }

    /* Barra superiore stile finestra Mac */
    .mac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .traffic-lights { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ff5f56; border: 0.5px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 0.5px solid #dea123; }
    .dot-green { background: #27c93f; border: 0.5px solid #1aab29; }
    .location-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: var(--text-sub); }

    /* Banner Allerta Dinamico */
    .alert-banner {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .status-VERDE {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .status-GIALLA {
      background: rgba(234, 179, 8, 0.2);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #fde047;
    }
    .status-ARANCIONE {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.3), rgba(234, 88, 12, 0.2));
      border: 1px solid rgba(249, 115, 22, 0.5);
      color: #ffedd5;
      animation: pulseAlert 2s infinite ease-in-out;
    }
    .status-ROSSA {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.35), rgba(185, 28, 28, 0.3));
      border: 1px solid rgba(239, 68, 68, 0.6);
      color: #fecdd3;
      animation: pulseAlert 1s infinite ease-in-out;
    }

    @keyframes pulseAlert {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.02); opacity: 0.9; }
    }

    .main-temp-section { text-align: center; margin-bottom: 20px; }
    .city-name { font-size: 28px;
