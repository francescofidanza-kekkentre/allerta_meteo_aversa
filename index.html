<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allerta Meteo Aversa</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">Meteo Aversa</h1>
            <span id="update-time" class="text-xs bg-blue-700 px-2.5 py-1 rounded-full">Aggiornamento...</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 w-full flex-grow flex flex-col justify-center">
        <div id="alert-card" class="bg-white rounded-2xl shadow-lg p-6 border-l-8 border-blue-500 transition-all duration-300">
            <div class="flex items-center space-x-3 mb-3">
                <div id="status-icon" class="text-3xl">📡</div>
                <h2 id="alert-title" class="text-lg font-semibold text-slate-900">Controllo bollettino in corso...</h2>
            </div>
            <p id="alert-desc" class="text-slate-600 text-sm leading-relaxed">Sto scaricando gli ultimi dati ufficiali per la zona di Aversa.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400">
        Allerta Meteo Aversa &bull; PWA & TWA Ready
    </footer>

    <!-- Service Worker & Dynamic Fetch Script -->
    <script>
        // Registrazione Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.error('Errore registrazione Service Worker:', err));
            });
        }

        // Funzione per caricare i dati meteo evitando la cache (Anti-Cache Timestamp)
        function loadWeatherData() {
            const timestamp = new Date().getTime();
            fetch('./alert.json?t=' + timestamp)
                .then(response => {
                    if (!response.ok) throw new Error('Errore nel recupero dati');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('alert-title').innerText = data.title || "Nessuna allerta attiva";
                    document.getElementById('alert-desc').innerText = data.description || "Il comune di Aversa non registra criticità al momento.";
                    document.getElementById('update-time').innerText = data.time || "Aggiornato adesso";
                    
                    const card = document.getElementById('alert-card');
                    if (data.level === 'red') {
                        card.className = "bg-white rounded-2xl shadow-lg p-6 border-l-8 border-red-600 transition-all duration-300";
                    } else if (data.level === 'orange' || data.level === 'yellow') {
                        card.className = "bg-white rounded-2xl shadow-lg p-6 border-l-8 border-amber-500 transition-all duration-300";
                    } else {
                        card.className = "bg-white rounded-2xl shadow-lg p-6 border-l-8 border-emerald-500 transition-all duration-300";
                    }
                })
                .catch(error => {
                    console.error('Impossibile aggiornare i dati:', error);
                    document.getElementById('alert-title').innerText = "Modalità Offline / Connessione lenta";
                    document.getElementById('alert-desc').innerText = "Impossibile recuperare l'ultimo bollettino. Mostro i dati salvati in cache.";
                });
        }

        // Esegui al caricamento della pagina
        loadWeatherData();
    </script>
</body>
</html>
