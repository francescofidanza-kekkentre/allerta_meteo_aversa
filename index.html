<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aversa Meteo & Allerte - macOS Widget</title>

  <!-- PWA Metadata & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #cbd5e1 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    /* Card Widget macOS Glassmorphism in Light Mode */
    .widget-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      width: 100%;
      max-width: 430px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    /* macOS Header */
    .mac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ff5f56; border: 0.5px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 0.5px solid #dea123; }
    .dot-green { background: #27c93f; border: 0.5px solid #1aab29; }
    .widget-title { font-size: 13px; color: #64748b; font-weight: 600; }

    /* Pulsante Aggiornamento Manuale */
    .refresh-btn {
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      outline: none;
    }
    .refresh-btn:hover { background: rgba(0, 0, 0, 0.09); }
    .refresh-btn.spinning { animation: spinAnim 0.8s linear infinite; }
    @keyframes spinAnim {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Tab Switcher (50/50 uguali) */
    .tab-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 16px;
      gap: 4px;
      width: 100%;
    }

    .tab-btn {
      flex: 1 1 0;
      width: 50%;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Sezione Allerta Stile Base44 */
    .alert-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #334155;
      text-transform: uppercase;
    }
    .update-time-top { font-size: 11px; color: #94a3b8; }

    .base44-alert-card {
      display: flex;
      gap: 12px;
      background: #fefce8;
      border: 1px solid #fef08a;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .alert-icon-box {
      width: 32px;
      height: 32px;
      background: #fef3c7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .alert-content { flex: 1; }
    .alert-title {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .alert-badge {
      display: inline-block;
      background: #ffedd5;
      color: #c2410c;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .alert-summary {
      font-size: 12px;
      line-height: 1.45;
      color: #475569;
    }

    .alert-extended-text {
      font-size: 12px;
      line-height: 1.55;
      color: #64748b;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
    }

    /* Meteo Corrente */
    .main-temp { text-align: center; margin-bottom: 18px; }
    .city { font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px; }
    .temp-val { font-size: 58px; font-weight: 800; color: #0f172a; margin: 2px 0; letter-spacing: -2px; }
    .condition { font-size: 14px; color: #64748b; text-transform: capitalize; font-weight: 500; }

    /* Metriche Griglia */
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; font-weight: 500; }
    .stat-val { font-size: 13px; font-weight: 700; color: #1e293b; }

    /* Grafico 24h con scale per assi */
    .sec-title { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-box {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 16px;
      padding: 12px 8px 8px 8px;
      margin-bottom: 16px;
    }
    canvas { width: 100% !important; height: 135px !important; display: block; }

    /* Lista Ora per Ora (48h) */
    .hourly-scroll {
      max-height: 340px;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .hourly-scroll::-webkit-scrollbar { width: 5px; }
    .hourly-scroll::-webkit-scrollbar-track { background: transparent; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 10px; }

    .day-header {
      font-size: 12px;
      font-weight: 700;
      color: #0284c7;
      background: rgba(2, 132, 199, 0.08);
      padding: 6px 10px;
      border-radius: 8px;
      margin-top: 6px;
      margin-bottom: 2px;
    }

    .hourly-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(0, 0, 0, 0.04);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .hourly-time { font-weight: 600; width: 50px; color: #334155; }
    .hourly-icon-desc { display: flex; align-items: center; gap: 6px; flex: 1; color: #64748b; font-size: 12px; }
    .hourly-rain { font-size: 11px; color: #0284c7; font-weight: 600; width: 48px; text-align: right; }
    .hourly-temp { font-weight: 700; color: #0f172a; width: 36px; text-align: right; }

    /* Pulsanti Azione */
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pdf {
      color: #334155;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .btn-pdf:hover { background: rgba(0, 0, 0, 0.08); }

    .btn-pwa {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      display: none;
    }
    .btn-pwa:hover { background: #0369a1; }

    .footer-time { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="widget-card">
    <!-- Header Mac con Tasto Refresh -->
    <div class="mac-header">
      <div class="dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="widget-title">Aversa (CE) • Protezione Civile</div>
      <button id="refreshBtn" class="refresh-btn" onclick="manualRefresh()" title="Aggiorna ora">🔄</button>
    </div>

    <!-- Switcher Schede / Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('tab-live', this)">Meteo & Allerta</button>
      <button class="tab-btn" onclick="switchTab('tab-hourly', this)">Ora per Ora (48h)</button>
    </div>

    <!-- TAB 1: Meteo Live & Allerta -->
    <div id="tab-live" class="tab-pane active">
      
      <div class="alert-section-header">
        <span class="section-label">Allerte in Vigore</span>
        <span class="update-time-top" id="updateTime">In verifica...</span>
      </div>

      <!-- Card Allerta 100% Dinamica dal backend JSON -->
      <div class="base44-alert-card" id="alertCard">
        <div class="alert-icon-box" id="alertIcon">⚠️</div>
        <div class="alert-content">
          <div class="alert-title" id="alertTitle">
