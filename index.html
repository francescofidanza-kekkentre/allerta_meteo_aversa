<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meteo & Allerte Aversa</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .alert-banner { padding: 16px; border-radius: 16px; font-weight: bold; margin: 15px 0; font-size: 15px; transition: all 0.3s; text-align: center; }
    .status-VERDE { background: rgba(76, 175, 80, 0.2); color: #81c784; border: 1px solid #4caf50; }
    .status-GIALLA { background: rgba(255, 179, 0, 0.2); color: #ffd54f; border: 1px solid #ffb300; }
    .status-ARANCIONE { background: rgba(255, 87, 34, 0.25); color: #ff8a65; border: 1px solid #ff5722; animation: pulse 2s infinite; }
    .status-ROSSA { background: rgba(229, 57, 53, 0.3); color: #e57373; border: 1px solid #e53935; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    .temp { font-size: 54px; font-weight: bold; margin: 10px 0; }
    .stats { display: flex; justify-content: space-around; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; }
    .btn { display: block; background: #007aff; color: white; text-decoration: none; padding: 14px; border-radius: 14px; font-weight: 600; margin-top: 10px; border: none; width: 100%; box-sizing: border-box; cursor: pointer; }
    .updated { font-size: 11px; color: #888; margin-top: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Aversa (CE)</h2>
    <div id="alertBox" class="alert-banner status-VERDE">Caricamento allerta...</div>

    <div class="temp" id="temp">--°C</div>
    <div class="stats">
      <div>Vento: <b id="wind">--</b></div>
      <div>Pioggia: <b id="rain">--</b></div>
    </div>

    <a href="http://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo" target="_blank" class="btn" style="background: rgba(255,255,255,0.1); margin-bottom: 10px;">📄 Bollettino Ufficiale PDF</a>
    <button id="installBtn" class="btn" style="display:none;">📲 Installa App</button>
    <div class="updated" id="lastUpdate">Ultimo controllo: --</div>
  </div>

  <script>
    // 1. Legge lo stato dell'allerta dal file JSON generato dal backend GitHub
    async function loadAlert() {
      try {
        const res = await fetch('./alert.json?v=' + new Date().getTime());
        const data = await res.json();
        const box = document.getElementById('alertBox');
        box.className = 'alert-banner status-' + data.status;
        box.innerHTML = data.message;
        document.getElementById('lastUpdate').textContent = 'Ultima verifica: ' + data.updated_at;
      } catch (e) {
        document.getElementById('alertBox').textContent = '⚠️ Errore lettura allerta';
      }
    }

    // 2. Legge i dati meteorologici in tempo reale
    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.97&longitude=14.20&current_weather=true&daily=precipitation_sum&timezone=Europe/Rome');
        const data = await res.json();
        document.getElementById('temp').textContent = Math.round(data.current_weather.temperature) + '°C';
        document.getElementById('wind').textContent = data.current_weather.windspeed + ' km/h';
        document.getElementById('rain').textContent = (data.daily.precipitation_sum[0] || 0) + ' mm';
      } catch (e) {}
    }

    loadAlert();
    loadWeather();

    // PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installBtn');
      btn.style.display = 'block';
      btn.onclick = () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
      };
    });
  </script>
</body>
</html>
