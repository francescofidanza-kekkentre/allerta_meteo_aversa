<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aversa Meteo & Allerte - macOS Widget</title>

  <!-- PWA Metadata & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1163/1163661.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 50%, #cbd5e1 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    /* Card Widget macOS Glassmorphism in Light Mode */
    .widget-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      width: 100%;
      max-width: 390px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    /* macOS Header (Traffic Lights) */
    .mac-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .dots { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-red { background: #ff5f56; border: 0.5px solid #e0443e; }
    .dot-yellow { background: #ffbd2e; border: 0.5px solid #dea123; }
    .dot-green { background: #27c93f; border: 0.5px solid #1aab29; }
    .widget-title { font-size: 13px; color: #64748b; font-weight: 600; }

    /* Banner Allerta Dinamico (Light Theme) */
    .alert-banner {
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.3s ease;
    }

    .status-VERDE {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #15803d;
    }
    .status-GIALLA {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #b45309;
    }
    .status-ARANCIONE {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.45);
      color: #c2410c;
      animation: pulseBanner 2s infinite ease-in-out;
    }
    .status-ROSSA {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #b91c1c;
      animation: pulseBanner 1s infinite ease-in-out;
    }

    @keyframes pulseBanner {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.88; transform: scale(1.01); }
    }

    /* Meteo Corrente */
    .main-temp { text-align: center; margin-bottom: 18px; }
    .city { font-size: 24px; font-weight: 700; color: #0f172a; letter-spacing: -0.3px; }
    .temp-val { font-size: 58px; font-weight: 800; color: #0f172a; margin: 2px 0; letter-spacing: -2px; }
    .condition { font-size: 14px; color: #64748b; text-transform: capitalize; font-weight: 500; }

    /* Metriche Griglia */
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-label { font-size: 11px; color: #64748b; display: block; margin-bottom: 4px; font-weight: 500; }
    .stat-val { font-size: 13px; font-weight: 700; color: #1e293b; }

    /* Grafico 24h */
    .sec-title { font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-box {
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 16px;
    }
    canvas { width: 100% !important; height: 80px !important; display: block; }

    /* Pulsanti */
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-pdf {
      color: #334155;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .btn-pdf:hover { background: rgba(0, 0, 0, 0.08); }

    .btn-pwa {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
      display: none;
    }
    .btn-pwa:hover { background: #0369a1; }

    .footer-time { text-align: center; font-size: 11px; color: #94a3b8; margin-top: 14px; }
  </style>
</head>
<body>

  <div class="widget-card">
    <!-- Header Mac -->
    <div class="mac-header">
      <div class="dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <div class="widget-title">Aversa (CE) • Protezione Civile</div>
    </div>

    <!-- Banner Allerta Reale -->
    <div id="alertBanner" class="alert-banner status-VERDE">
      Caricamento stato allerta...
    </div>

    <!-- Meteo Principale -->
    <div class="main-temp">
      <div class="city">Aversa</div>
      <div class="temp-val" id="currentTemp">--°</div>
      <div class="condition" id="weatherCondition">Caricamento meteo...</div>
    </div>

    <!-- Metriche -->
    <div class="grid-stats">
      <div class="stat-card">
        <span class="stat-label">Vento</span>
        <span class="stat-val" id="windSpeed">-- km/h</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pioggia Oggi</span>
        <span class="stat-val" id="rainAmount">-- mm</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Umidità</span>
        <span class="stat-val" id="humidityVal">-- %</span>
      </div>
    </div>

    <!-- Grafico Temperature 24 Ore -->
    <div class="sec-title">Evoluzione 24h</div>
    <div class="chart-box">
      <canvas id="tempChart"></canvas>
    </div>

    <!-- Pulsanti Azione -->
    <div class="btn-group">
      <a href="http://centrofunzionale.regione.campania.it/it/bollettini/bollettino-meteo" target="_blank" rel="noopener" class="btn btn-pdf">
        📄 Bollettino Ufficiale PDF
      </a>
      <button id="installBtn" class="btn btn-pwa">📲 Installa come App su Mac / Smartphone</button>
    </div>

    <div class="footer-time" id="updateTime">Ultimo controllo: --</div>
  </div>

  <script>
    // 1. Caricamento dinamico dello stato allerta dal file alert.json
    async function loadAlert() {
      try {
        const response = await fetch('./alert.json?v=' + new Date().getTime());
        if (response.ok) {
          const data = await response.json();
          const banner = document.getElementById('alertBanner');
          banner.className = 'alert-banner status-' + data.status;
          banner.textContent = data.message;
          document.getElementById('updateTime').textContent = 'Ultima verifica: ' + data.updated_at;
        }
      } catch (e) {
        console.warn("Lettura alert.json fallita, uso stato predefinito.", e);
      }
    }

    // 2. Caricamento meteo live da Open-Meteo per Aversa
    async function loadMeteo() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.973&longitude=14.205&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=temperature_2m&daily=precipitation_sum&timezone=Europe%2FRome';
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById('currentTemp').textContent = Math.round(data.current.temperature_2m) + '°';
        document.getElementById('windSpeed').textContent = data.current.wind_speed_10m + ' km/h';
        document.getElementById('humidityVal').textContent = data.current.relative_humidity_2m + ' %';
        document.getElementById('rainAmount').textContent = (data.daily.precipitation_sum[0] || 0) + ' mm';
        document.getElementById('weatherCondition').textContent = getWeatherDesc(data.current.weather_code);

        drawChart(data.hourly.temperature_2m.slice(0, 24));
      } catch (e) {
        console.error("Errore recupero meteo:", e);
      }
    }

    function getWeatherDesc(code) {
      const map = {
        0: 'Sereno', 1: 'Prevalentemente Sereno', 2: 'Parzialmente Nuvoloso', 3: 'Coperto',
        45: 'Nebbia', 51: 'Pioggerella', 61: 'Pioggia Moderata', 63: 'Pioggia Forte',
        80: 'Rovesci di Pioggia', 95: 'Temporale', 96: 'Temporale con Forte Pioggia'
      };
      return map[code] || 'Variabile';
    }

    function drawChart(temps) {
      const canvas = document.getElementById('tempChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      
      canvas.width = canvas.offsetWidth * dpr;
      canvas.height = canvas.offsetHeight * dpr;
      ctx.scale(dpr, dpr);

      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      if (w === 0 || h === 0) return;

      const min = Math.min(...temps) - 1;
      const max = Math.max(...temps) + 1;

      ctx.clearRect(0, 0, w, h);

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, 'rgba(2, 132, 199, 0.25)');
      grad.addColorStop(1, 'rgba(2, 132, 199, 0.0)');

      ctx.beginPath();
      temps.forEach((t, i) => {
        const x = (i / (temps.length - 1)) * w;
        const y = h - ((t - min) / (max - min)) * (h - 16) - 8;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.strokeStyle = '#0284c7';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // Supporto PWA Install Prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('installBtn');
      btn.style.display = 'flex';
      btn.onclick = () => {
        btn.style.display = 'none';
        deferredPrompt.prompt();
      };
    });

    loadAlert();
    loadMeteo();
  </script>
</body>
</html>
